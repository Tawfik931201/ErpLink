name: Deploy Shopify app configuration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-production-app-deploy
  cancel-in-progress: false

jobs:
  deploy-shopify:
    name: Release Shopify app configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SERVICE_ACCOUNT_TOKEN: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
      SHOPIFY_CLI_NO_ANALYTICS: '1'
      CI: 'true'
    steps:
      - name: Verify Shopify deployment credential
        shell: bash
        run: |
          if [ -n "$APP_AUTOMATION_TOKEN" ]; then
            echo "Using app-scoped Shopify App Automation Token"
            echo "SHOPIFY_APP_AUTOMATION_TOKEN=$APP_AUTOMATION_TOKEN" >> "$GITHUB_ENV"
          elif [ -n "$SERVICE_ACCOUNT_TOKEN" ]; then
            echo "Using Shopify Service Account Token"
            echo "SHOPIFY_SERVICE_ACCOUNT_TOKEN=$SERVICE_ACCOUNT_TOKEN" >> "$GITHUB_ENV"
          else
            echo "::error::Missing Shopify deployment credential. Add SHOPIFY_APP_AUTOMATION_TOKEN (preferred) or SHOPIFY_SERVICE_ACCOUNT_TOKEN to GitHub Actions secrets."
            exit 1
          fi

      - name: Checkout the exact version to release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@5.0.2

      - name: Publish Shopify app version
        run: |
          shopify app deploy \
            --allow-updates \
            --no-input \
            --source-control-url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
