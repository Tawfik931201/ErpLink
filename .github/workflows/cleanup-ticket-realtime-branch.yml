name: Cleanup merged ticket realtime feature branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  remove-temporary-ticket-branch:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.number == 68 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/odoo-ticket-realtime-only-20261123' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged ticket realtime branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/feat/odoo-ticket-realtime-only-20261123" ||
            echo 'Temporary ticket realtime branch was already removed'
