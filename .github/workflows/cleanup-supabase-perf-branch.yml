name: Delete merged Supabase performance feature branch
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  delete-merged-feature-branch:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.number == 76 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'perf/supabase-free-tier-optimization-20261124' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete exactly the merged performance branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/perf/supabase-free-tier-optimization-20261124" ||
            echo "Feature branch already deleted; verify from GitHub before reporting."
