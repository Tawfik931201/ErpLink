name: Cleanup temporary SEO GEO branch after squash merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'seo/intent-pages-geo-20261123' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged temporary SEO GEO branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/seo/intent-pages-geo-20261123" ||
            echo 'Temporary SEO GEO branch was already removed'
