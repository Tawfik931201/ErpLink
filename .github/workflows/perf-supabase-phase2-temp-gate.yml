name: Temporary phase2 Supabase performance release gate
on:
  push:
    branches: [perf/supabase-capacity-phase2-20261124]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-anon-test-only
      SUPABASE_SERVICE_ROLE_KEY: offline-service-role-test-only
      ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder_for_offline_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run type-check
      - name: Jest regression tests
        run: npm test -- --runInBand
      - name: Next.js production build
        run: npm run build
