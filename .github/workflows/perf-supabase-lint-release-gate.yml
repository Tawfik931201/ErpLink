name: Temporary Supabase performance lint repair and release gate
on:
  push:
    branches:
      - perf/supabase-free-tier-optimization-20261124

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-anon-test-only
      SUPABASE_SERVICE_ROLE_KEY: offline-service-role-test-only
      ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder_for_offline_build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fix only the files with current ESLint errors
        shell: bash
        run: |
          ./node_modules/.bin/eslint src --ext .ts,.tsx --format json > /tmp/erplink-lint.json || true
          mapfile -t files < <(node -e 'for (const item of require("/tmp/erplink-lint.json")) if (item.errorCount > 0) console.log(item.filePath)')
          echo "Files with blocking ESLint errors: ${#files[@]}"
          if [ "${#files[@]}" -gt 0 ]; then
            ./node_modules/.bin/eslint "${files[@]}" --fix || true
          fi
          git diff --check
          git diff --stat
      - name: Commit scoped formatting to the feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/
          if ! git diff --cached --quiet; then
            git commit -m "style: repair remaining existing import order lint errors"
            git push origin HEAD:refs/heads/perf/supabase-free-tier-optimization-20261124
          fi
      - name: Print remaining ESLint blockers in a compact format
        shell: bash
        run: |
          ./node_modules/.bin/eslint src --ext .ts,.tsx --format json > /tmp/erplink-lint-after.json || true
          node -e 'const path=require("path");for(const f of require("/tmp/erplink-lint-after.json")) for(const m of f.messages) if(m.severity===2) console.log(path.relative(process.cwd(),f.filePath)+":"+m.line+":"+m.column+" "+m.ruleId+" "+m.message)'
      - name: Full repository lint
        run: npm run lint
      - name: TypeScript
        run: npm run type-check
      - name: Full Jest regression suite
        run: npm test -- --runInBand
      - name: Production build with offline test-only credentials
        run: npm run build
