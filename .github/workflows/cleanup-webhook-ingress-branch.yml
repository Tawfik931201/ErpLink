name: Cleanup temporary webhook ingress security branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  delete-temporary-webhook-security-branch:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.number == 61 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'security/webhook-stream-bounds-trusted-rate-limits-20261123' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/security/webhook-stream-bounds-trusted-rate-limits-20261123" ||
            echo 'Branch was already removed by GitHub auto-delete'
