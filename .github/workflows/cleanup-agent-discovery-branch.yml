name: Cleanup public agent discovery feature branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/agent-discovery-public-20261123' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged public agent discovery branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/feat/agent-discovery-public-20261123" ||
            echo 'Temporary branch already removed'
