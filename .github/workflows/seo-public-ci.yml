name: Public SEO safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'public/google5f56418af287a69f.html'
      - 'src/app/(public)/**'
      - 'src/components/public-site-footer.tsx'
      - 'src/lib/public-seo.ts'
      - 'src/lib/public-structured-data.ts'
      - 'src/components/public-integration-detail.tsx'
      - 'tests/unit/public-structured-data.test.ts'
      - 'src/lib/public-agent-content.ts'
      - 'src/lib/public-business-profile.ts'
      - 'src/lib/public-mcp.ts'
      - 'src/middleware.ts'
      - 'next.config.js'
      - 'src/app/api/public-mcp/**'
      - 'src/app/api/public-markdown/**'
      - 'public/.well-known/**'
      - 'public/agent-tools.js'
      - 'scripts/verify-public-agent.mjs'
      - 'tests/unit/agent-readiness.test.ts'
      - 'docs/agent-readiness.md'
      - '.github/workflows/cleanup-agent-discovery-branch.yml'
      - 'scripts/verify-public-seo.mjs'
      - '.github/workflows/seo-public-ci.yml'

permissions:
  contents: read

jobs:
  public-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check app
        run: npm run type-check
      - name: Check SEO routes and private-route exclusions
        run: node scripts/verify-public-seo.mjs
      - name: Validate public agent card, Markdown, WebMCP and isolation
        run: |
          node scripts/verify-public-agent.mjs
          node --check public/agent-tools.js
      - name: Existing application regression tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-anon-test-only
          SUPABASE_SERVICE_ROLE_KEY: offline-service-role-test-only
        run: npm test -- --runInBand
