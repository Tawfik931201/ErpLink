name: Cleanup merged ticket realtime fast-path branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  remove-temporary-ticket-fix-branch:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.number == 70 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'fix/ticket-realtime-hook-fast-path-20261123' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged realtime fast-path branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/fix/ticket-realtime-hook-fast-path-20261123" ||
            echo 'Temporary ticket realtime fast-path branch already removed'
