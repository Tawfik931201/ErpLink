name: Shopify integration safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/shopify/**'
      - 'src/app/api/webhooks/shopify/**'
      - 'src/lib/shopify/**'
      - 'src/lib/shopify-client.ts'
      - 'src/app/actions/workspaces.ts'
      - 'src/app/(app)/app/connect-store/**'
      - 'shopify.app.toml'
      - '.github/workflows/deploy-shopify.yml'
      - '.github/workflows/shopify-ci.yml'
      - 'tests/unit/shopify-*.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-anon-test-only
      SUPABASE_SERVICE_ROLE_KEY: offline-service-role-test-only
      NEXT_PUBLIC_APP_URL: https://erplink.bizsahla.com
      SHOPIFY_CLIENT_ID: d06554dc4b298108a0cfdd6c4336ae08
      SHOPIFY_CLIENT_SECRET: offline-secret-only
      SHOPIFY_REDIRECT_URI: https://erplink.bizsahla.com/api/shopify/callback
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run type-check
      - name: Shopify OAuth and webhook regression tests
        run: npm test -- --runInBand tests/unit/shopify-oauth-state.test.ts tests/unit/shopify-oauth-contract.test.ts tests/unit/shopify-platform-integration.test.ts tests/unit/shopify-webhook-gate.test.ts
      - name: Next.js production build
        run: npm run build
