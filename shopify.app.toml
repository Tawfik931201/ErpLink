# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "99837c2c1a973e3b8ad905bc4dbf931f"
# Production URL — SINGLE SOURCE: ${NEXT_PUBLIC_APP_URL} (same value as .env).
# Shopify CLI expands ${VAR} from the shell at deploy time (`shopify app deploy`).
# Never commit ngrok URLs here. Keep api_version + topics in sync with
# src/lib/shopify-topics.ts (SHOPIFY_TOPIC_CATALOG) and the Advanced-settings UI.
# Webhook URI must be https + reachable; HMAC is verified in
# src/app/api/webhooks/shopify/route.ts via SHOPIFY_WEBHOOK_SECRET.
application_url = "${NEXT_PUBLIC_APP_URL}"
embedded = true
name = "ErpLink"

[webhooks]
# Must match SHOPIFY_API_VERSION in src/lib/shopify-client.ts (env SHOPIFY_API_VERSION).
api_version = "2026-10"

# Store-sync topics are shop-scoped and registered through GraphQL after OAuth,
# so each merchant's saved toggles can actually enable/disable deliveries.
# Only lifecycle/compliance topics stay app-scoped here.
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "${NEXT_PUBLIC_APP_URL}/api/webhooks/shopify"

[[webhooks.subscriptions]]
topics = ["customers/data_request", "customers/redact", "shop/redact", "app/scopes_update"]
uri = "${NEXT_PUBLIC_APP_URL}/api/webhooks/shopify"

[access_scopes]
# Install scopes match features exposed immediately after connection:
# store→ERP catalog/orders/customers plus ERP→Shopify product/category/customer
# Data Transfer. read_all_orders and write_orders remain optional.
#
# Protected customer data + order history (App Store review notes):
# - customers/* topics need read_customers (protected): requires Shopify
#   approval + a usage justification in Partner Dashboard → App setup.
#   Without it, customers/* subscriptions fail silently (403).
#   See https://shopify.dev/docs/apps/launch/protected-customer-data
# - orders/* with read_orders only returns the last 60 days. Reading older
#   orders needs read_all_orders (also approval-gated; request it in
#   Partner Dashboard → API access, then add it here). Kept optional so fresh
#   installs stay minimal and review-friendly.
scopes = "read_products,write_products,read_orders,read_inventory,read_locations,read_customers,write_customers"
optional_scopes = ["write_orders", "read_all_orders"]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  # Same ${NEXT_PUBLIC_APP_URL} source — must match SHOPIFY_REDIRECT_URI in .env
  "${NEXT_PUBLIC_APP_URL}/api/shopify/callback"
]
